name: Update latest quotes

on:
  schedule:
    # 06:00 JST, Tuesday-Saturday. GitHub Actions cron uses UTC.
    - cron: "0 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-latest-quotes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate latest quotes
        run: python generate_latest_quotes.py

      - name: Commit latest quotes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest-quotes.json
          git diff --cached --quiet && echo "No quote changes" && exit 0
          git commit -m "Update latest quotes"
          git push
